name: Deploy Geeta GPT AI

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest

    - name: Deploy on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          docker stop geeta-ai || true
          docker rm geeta-ai || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest

          docker run -d -p 8000:8000 \
          -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY }} \
          -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_KEY }} \
          --name geeta-ai \
          ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest