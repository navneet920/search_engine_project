name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gita-ai:latest .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/gita-ai:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop gita-app || true
          docker rm gita-app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/gita-ai:latest
          docker run -d -p 8000:8000 --name gita-app ${{ secrets.DOCKER_USERNAME }}/gita-ai:latests