name: Deploy Geeta GPT AI

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop geeta-ai || true
          docker rm geeta-ai || true

          docker pull ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest

          docker run -d -p 8000:8000 \
          --name geeta-ai \
          -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY }} \
          -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_KEY }} \
          ${{ secrets.DOCKER_USERNAME }}/geeta-ai:latest